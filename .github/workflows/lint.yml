name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    name: Ruff (syntax errors + undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python sources (notebooks excluded)
        run: ruff check --select=E9,F63,F7,F82 --exclude '*.ipynb' .
